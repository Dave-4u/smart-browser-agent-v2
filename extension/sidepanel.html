<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f0f12;
      color: #e8e8ed;
      font-size: 14px;
    }
    h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
    .sub { color: #888; font-size: 12px; margin-bottom: 14px; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      margin: 6px 0;
      font-weight: 500;
    }
    button.secondary { background: #2a2a32; }
    button:hover { background: #2563eb; }
    button.secondary:hover { background: #3a3a44; }
    button:disabled { background: #333; cursor: not-allowed; opacity: 0.7; }
    #extracted, #result {
      background: #1a1a20;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 12.5px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #2a2a32;
    }
    #extracted { border-left: 3px solid #555; }
    #result { border-left: 3px solid #3b82f6; }
    textarea, input {
      width: 100%;
      background: #1a1a20;
      color: #e8e8ed;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      margin-top: 6px;
      box-sizing: border-box;
    }
    textarea { min-height: 70px; resize: vertical; }
    .status { color: #777; font-size: 11.5px; margin-top: 8px; }
    .warning { color: #fbbf24; }
    .label {
      color: #777;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 12px 0 4px;
      font-weight: 500;
    }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input { flex: 1; margin-top: 0; }
    .key-row button { width: auto; margin: 0; padding: 8px 12px; }
    .badge {
      display: inline-block;
      background: #1e3a5f;
      color: #93c5fd;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h2>Smart Labeling Assistant <span class="badge">v2</span></h2>
  <div class="sub">Gemini vision · Quality → Prompt → Beauty rules · Never auto-submits</div>

  <div class="label">Gemini API Key (free from aistudio.google.com)</div>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="Paste your Gemini API key">
    <button id="saveKey" class="secondary">Save</button>
  </div>
  <div class="status" id="keyStatus"></div>

  <button id="analyze">Analyze this page</button>

  <div class="label">Extracted prompt & images</div>
  <div id="extracted">Click Analyze to extract the prompt and the two generated images.</div>

  <div class="label">Recommendation</div>
  <div id="result">Waiting…</div>

  <div class="label">Correction / Feedback (optional)</div>
  <textarea id="feedback" placeholder="e.g. Image 1 has better anatomy but Image 2 matches the gold earring better…"></textarea>
  <button id="correct" class="secondary">Re-evaluate with feedback</button>

  <div class="status" id="status"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
